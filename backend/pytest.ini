[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
pythonpath = .
markers =
    integracion: requiere DATABASE_URL_TEST y el esquema `test` aplicado; se omite si falta (P20).
# El run por defecto solo ejecuta las pruebas unitarias (segundos, sin red):
#   pytest
# Las pruebas que sí golpean Supabase se corren aparte con:
#   pytest -m integracion
# El -m de la línea de comandos pisa este addopts, así que los dos comandos
# anteriores funcionan sin banderas extra.
addopts = -m "not integracion"